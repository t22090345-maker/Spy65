name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          set -e

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BackgroundCamera"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          mkdir -p app/src/main/java/com/example/backgroundcamera
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap
          mkdir -p app/src/main/res/xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.backgroundcamera'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.backgroundcamera"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              def camerax_version = "1.3.4"
              implementation "androidx.camera:camera-core:${camerax_version}"
              implementation "androidx.camera:camera-camera2:${camerax_version}"
              implementation "androidx.camera:camera-lifecycle:${camerax_version}"
              implementation "androidx.camera:camera-video:${camerax_version}"
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.BackgroundCamera">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".TrashActivity" android:exported="false" />
                  <activity android:name=".SettingsActivity" android:exported="false" />

                  <service
                      android:name=".RecordingService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="camera|microphone" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.example.backgroundcamera.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="movies" path="Movies/" />
              <external-files-path name="trash" path="Trash/" />
          </paths>
          EOF

          cat > app/src/main/java/com/example/backgroundcamera/MainActivity.kt <<'EOF'
          package com.example.backgroundcamera

          import android.Manifest
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.core.content.FileProvider
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : AppCompatActivity() {

              private lateinit var btnStart: Button
              private lateinit var btnStop: Button
              private lateinit var btnTrash: Button
              private lateinit var btnSettings: Button
              private lateinit var videoListLayout: LinearLayout
              private lateinit var topBar: LinearLayout
              private lateinit var tvSelectedCount: TextView
              private lateinit var btnExport: Button
              private lateinit var btnDelete: Button
              private lateinit var btnCancel: Button

              private val selected = mutableSetOf<File>()
              private var selectionMode = false

              private val permLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { r ->
                  if (r.values.all { it }) startRecordingService()
                  else Toast.makeText(this, "Saare permissions chahiye", Toast.LENGTH_LONG).show()
              }

              private val requiredPermissions = mutableListOf(
                  Manifest.permission.CAMERA,
                  Manifest.permission.RECORD_AUDIO
              ).apply {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU)
                      add(Manifest.permission.POST_NOTIFICATIONS)
              }.toTypedArray()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  btnStart = findViewById(R.id.btnStart)
                  btnStop = findViewById(R.id.btnStop)
                  btnTrash = findViewById(R.id.btnTrash)
                  btnSettings = findViewById(R.id.btnSettings)
                  videoListLayout = findViewById(R.id.videoListLayout)
                  topBar = findViewById(R.id.topBar)
                  tvSelectedCount = findViewById(R.id.tvSelectedCount)
                  btnExport = findViewById(R.id.btnExport)
                  btnDelete = findViewById(R.id.btnDelete)
                  btnCancel = findViewById(R.id.btnCancel)

                  btnStart.setOnClickListener {
                      if (hasAllPerms()) startRecordingService()
                      else permLauncher.launch(requiredPermissions)
                  }
                  btnStop.setOnClickListener { stopRecordingService() }
                  btnTrash.setOnClickListener {
                      startActivity(Intent(this, TrashActivity::class.java))
                  }
                  btnSettings.setOnClickListener {
                      startActivity(Intent(this, SettingsActivity::class.java))
                  }
                  btnCancel.setOnClickListener { exitSelectionMode() }
                  btnExport.setOnClickListener { exportSelected() }
                  btnDelete.setOnClickListener { deleteSelected() }
              }

              override fun onResume() {
                  super.onResume()
                  loadVideos()
              }

              private fun loadVideos() {
                  val dir = getExternalFilesDir(Environment.DIRECTORY_MOVIES)
                  val files = dir?.listFiles { f -> f.extension == "mp4" }
                      ?.sortedByDescending { it.lastModified() }

                  videoListLayout.removeAllViews()
                  selected.clear()
                  exitSelectionMode()

                  if (files.isNullOrEmpty()) {
                      val tv = TextView(this).apply {
                          text = "Abhi tak koi video record nahi hui."
                          gravity = Gravity.CENTER
                          setPadding(0, 48, 0, 48)
                      }
                      videoListLayout.addView(tv)
                      return
                  }

                  for (file in files) videoListLayout.addView(makeVideoRow(file))
              }

              private fun makeVideoRow(file: File): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(16, 16, 16, 16)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }
                  val cb = CheckBox(this).apply {
                      visibility = if (selectionMode) View.VISIBLE else View.GONE
                      isChecked = selected.contains(file)
                      setOnCheckedChangeListener { _, isChecked ->
                          if (isChecked) selected.add(file) else selected.remove(file)
                          updateTopBar()
                      }
                  }
                  val tv = TextView(this).apply {
                      text = prettyName(file)
                      textSize = 15f
                      setPadding(24, 8, 8, 8)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  row.addView(cb)
                  row.addView(tv)
                  row.setOnClickListener {
                      if (selectionMode) cb.isChecked = !cb.isChecked
                      else playVideo(file)
                  }
                  row.setOnLongClickListener {
                      if (!selectionMode) {
                          selectionMode = true
                          cb.visibility = View.VISIBLE
                          cb.isChecked = true
                          selected.add(file)
                          updateTopBar()
                          refreshVisibility()
                      }
                      true
                  }
                  return row
              }

              private fun refreshVisibility() {
                  for (i in 0 until videoListLayout.childCount) {
                      val row = videoListLayout.getChildAt(i) as? LinearLayout ?: continue
                      val cb = row.getChildAt(0) as? CheckBox ?: continue
                      cb.visibility = if (selectionMode) View.VISIBLE else View.GONE
                  }
              }

              private fun updateTopBar() {
                  if (selectionMode && selected.isNotEmpty()) {
                      topBar.visibility = View.VISIBLE
                      tvSelectedCount.text = "${selected.size} selected"
                  } else if (selectionMode) {
                      topBar.visibility = View.VISIBLE
                      tvSelectedCount.text = "0 selected"
                  } else {
                      topBar.visibility = View.GONE
                  }
              }

              private fun exitSelectionMode() {
                  selectionMode = false
                  selected.clear()
                  topBar.visibility = View.GONE
                  refreshVisibility()
                  for (i in 0 until videoListLayout.childCount) {
                      val row = videoListLayout.getChildAt(i) as? LinearLayout ?: continue
                      (row.getChildAt(0) as? CheckBox)?.isChecked = false
                  }
              }

              private fun prettyName(file: File): String {
                  val m = Regex("REC_(\\d{8})_(\\d{6})").find(file.nameWithoutExtension)
                  if (m != null) {
                      val d = m.groupValues[1]
                      val t = m.groupValues[2]
                      val fmtIn = SimpleDateFormat("yyyyMMddHHmmss", Locale.US)
                      val fmtOut = SimpleDateFormat("dd MMM yyyy, hh:mm a", Locale.US)
                      try {
                          val date = fmtIn.parse(d + t)
                          if (date != null) return fmtOut.format(date)
                      } catch (_: Exception) {}
                  }
                  return file.name
              }

              private fun playVideo(file: File) {
                  val uri: Uri = FileProvider.getUriForFile(
                      this, "com.example.backgroundcamera.fileprovider", file
                  )
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "video/mp4")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  try { startActivity(intent) }
                  catch (_: Exception) { Toast.makeText(this, "Koi video player nahi mila", Toast.LENGTH_SHORT).show() }
              }

              private fun deleteSelected() {
                  if (selected.isEmpty()) return
                  val trashDir = File(getExternalFilesDir(null), "Trash").apply { mkdirs() }
                  var count = 0
                  for (f in selected) {
                      val dest = File(trashDir, f.name)
                      if (f.renameTo(dest)) count++
                  }
                  Toast.makeText(this, "$count video Trash me bheji", Toast.LENGTH_SHORT).show()
                  loadVideos()
              }

              private fun exportSelected() {
                  if (selected.isEmpty()) return
                  var count = 0
                  for (f in selected) {
                      if (exportToPublic(f)) count++
                  }
                  Toast.makeText(this, "$count video Gallery me export hui", Toast.LENGTH_LONG).show()
                  exitSelectionMode()
              }

              private fun exportToPublic(file: File): Boolean {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Video.Media.DISPLAY_NAME, file.name)
                              put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                              put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/BackgroundCamera")
                          }
                          val uri = contentResolver.insert(
                              MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values
                          ) ?: return false
                          contentResolver.openOutputStream(uri)?.use { out ->
                              file.inputStream().use { it.copyTo(out) }
                          }
                          true
                      } else {
                          @Suppress("DEPRECATION")
                          val dest = File(
                              Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES),
                              "BackgroundCamera"
                          ).apply { mkdirs() }
                          val out = File(dest, file.name)
                          file.copyTo(out, overwrite = true)
                          true
                      }
                  } catch (e: Exception) {
                      e.printStackTrace(); false
                  }
              }

              private fun hasAllPerms() = requiredPermissions.all {
                  ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED
              }

              private fun startRecordingService() {
                  val i = Intent(this, RecordingService::class.java).apply {
                      action = RecordingService.ACTION_START
                  }
                  ContextCompat.startForegroundService(this, i)
                  Toast.makeText(this, "Recording start ho gayi", Toast.LENGTH_SHORT).show()
              }

              private fun stopRecordingService() {
                  val i = Intent(this, RecordingService::class.java).apply {
                      action = RecordingService.ACTION_STOP
                  }
                  startService(i)
                  Toast.makeText(this, "Recording band", Toast.LENGTH_SHORT).show()
                  videoListLayout.postDelayed({ loadVideos() }, 1500)
              }
          }
          EOF

          cat > app/src/main/java/com/example/backgroundcamera/TrashActivity.kt <<'EOF'
          package com.example.backgroundcamera

          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import java.io.File

          class TrashActivity : AppCompatActivity() {

              private lateinit var list: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_trash)
                  supportActionBar?.title = "Trash"
                  list = findViewById(R.id.trashList)
                  findViewById<Button>(R.id.btnEmptyAll).setOnClickListener { emptyAll() }
              }

              override fun onResume() { super.onResume(); load() }

              private fun trashDir(): File =
                  File(getExternalFilesDir(null), "Trash").apply { mkdirs() }

              private fun load() {
                  list.removeAllViews()
                  val files = trashDir().listFiles { f -> f.extension == "mp4" }
                      ?.sortedByDescending { it.lastModified() }
                  if (files.isNullOrEmpty()) {
                      list.addView(TextView(this).apply {
                          text = "Trash khali hai."
                          gravity = Gravity.CENTER
                          setPadding(0, 48, 0, 48)
                      })
                      return
                  }
                  for (f in files) list.addView(row(f))
              }

              private fun row(file: File): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(16, 16, 16, 16)
                  }
                  val tv = TextView(this).apply {
                      text = file.name
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val btnPlay = Button(this).apply {
                      text = "Play"
                      setOnClickListener { play(file) }
                  }
                  val btnRestore = Button(this).apply {
                      text = "Restore"
                      setOnClickListener { restore(file) }
                  }
                  val btnDel = Button(this).apply {
                      text = "Delete"
                      setOnClickListener { permanentDelete(file) }
                  }
                  row.addView(tv); row.addView(btnPlay); row.addView(btnRestore); row.addView(btnDel)
                  return row
              }

              private fun play(file: File) {
                  val uri: Uri = FileProvider.getUriForFile(
                      this, "com.example.backgroundcamera.fileprovider", file
                  )
                  val i = android.content.Intent(android.content.Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "video/mp4")
                      addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  try { startActivity(i) } catch (_: Exception) {}
              }

              private fun restore(file: File) {
                  val movies = getExternalFilesDir(android.os.Environment.DIRECTORY_MOVIES) ?: return
                  movies.mkdirs()
                  val dest = File(movies, file.name)
                  if (file.renameTo(dest)) {
                      Toast.makeText(this, "Restore ho gayi", Toast.LENGTH_SHORT).show()
                      load()
                  } else Toast.makeText(this, "Restore fail", Toast.LENGTH_SHORT).show()
              }

              private fun permanentDelete(file: File) {
                  if (file.delete()) {
                      Toast.makeText(this, "Permanently delete", Toast.LENGTH_SHORT).show()
                      load()
                  }
              }

              private fun emptyAll() {
                  trashDir().listFiles()?.forEach { it.delete() }
                  Toast.makeText(this, "Trash khali kar di", Toast.LENGTH_SHORT).show()
                  load()
              }
          }
          EOF

          cat > app/src/main/java/com/example/backgroundcamera/SettingsActivity.kt <<'EOF'
          package com.example.backgroundcamera

          import android.content.SharedPreferences
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class SettingsActivity : AppCompatActivity() {

              private lateinit var prefs: SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)
                  supportActionBar?.title = "Notification Settings"
                  prefs = getSharedPreferences("notif_prefs", MODE_PRIVATE)

                  val etTitle = findViewById<EditText>(R.id.etTitle)
                  val etText = findViewById<EditText>(R.id.etText)
                  val spinnerIcon = findViewById<Spinner>(R.id.spinnerIcon)
                  val spinnerImportance = findViewById<Spinner>(R.id.spinnerImportance)
                  val btnSave = findViewById<Button>(R.id.btnSave)

                  val icons = listOf("App Logo", "Camera", "Video", "Dot")
                  spinnerIcon.adapter = ArrayAdapter(
                      this, android.R.layout.simple_spinner_dropdown_item, icons
                  )
                  val importance = listOf("Hidden (Min)", "Silent (Low)", "Normal")
                  spinnerImportance.adapter = ArrayAdapter(
                      this, android.R.layout.simple_spinner_dropdown_item, importance
                  )

                  etTitle.setText(prefs.getString("title", "Recording"))
                  etText.setText(prefs.getString("text", "Running"))
                  spinnerIcon.setSelection(prefs.getInt("icon", 0))
                  spinnerImportance.setSelection(prefs.getInt("importance", 0))

                  btnSave.setOnClickListener {
                      prefs.edit()
                          .putString("title", etTitle.text.toString().ifBlank { "Recording" })
                          .putString("text", etText.text.toString().ifBlank { "Running" })
                          .putInt("icon", spinnerIcon.selectedItemPosition)
                          .putInt("importance", spinnerImportance.selectedItemPosition)
                          .apply()
                      Toast.makeText(this, "Save ho gaya. Agli recording se lagega.", Toast.LENGTH_LONG).show()
                      finish()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/backgroundcamera/RecordingService.kt <<'EOF'
          package com.example.backgroundcamera

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Environment
          import android.os.PowerManager
          import android.util.Log
          import androidx.camera.core.CameraSelector
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.FileOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleService
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Locale

          class RecordingService : LifecycleService() {

              companion object {
                  const val ACTION_START = "ACTION_START"
                  const val ACTION_STOP  = "ACTION_STOP"
                  private const val TAG = "RecordingService"
                  private const val CHANNEL_ID = "recording_channel"
                  private const val NOTIFICATION_ID = 101
              }

              private var cameraProvider: ProcessCameraProvider? = null
              private var videoCapture: VideoCapture<Recorder>? = null
              private var activeRecording: Recording? = null
              private lateinit var wakeLock: PowerManager.WakeLock
              private lateinit var prefs: SharedPreferences

              override fun onCreate() {
                  super.onCreate()
                  prefs = getSharedPreferences("notif_prefs", MODE_PRIVATE)
                  createNotificationChannel()
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK, "BackgroundCamera::WakeLock"
                  ).apply { setReferenceCounted(false) }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  super.onStartCommand(intent, flags, startId)
                  when (intent?.action) {
                      ACTION_START, null -> startRecording()
                      ACTION_STOP -> stopRecordingAndService()
                  }
                  return START_STICKY
              }

              private fun startRecording() {
                  val n = buildNotification()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICATION_ID, n,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA or
                                  ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      )
                  } else startForeground(NOTIFICATION_ID, n)
                  if (!wakeLock.isHeld) wakeLock.acquire()
                  initCameraAndRecord()
              }

              private fun initCameraAndRecord() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          cameraProvider = future.get()
                          val recorder = Recorder.Builder()
                              .setQualitySelector(QualitySelector.from(Quality.FHD))
                              .build()
                          videoCapture = VideoCapture.withOutput(recorder)
                          cameraProvider?.unbindAll()
                          cameraProvider?.bindToLifecycle(
                              this, CameraSelector.DEFAULT_BACK_CAMERA, videoCapture
                          )
                          beginVideoFileRecording()
                      } catch (e: Exception) {
                          Log.e(TAG, "Camera init fail", e)
                          stopRecordingAndService()
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun beginVideoFileRecording() {
                  val capture = videoCapture ?: return
                  val dir = getExternalFilesDir(Environment.DIRECTORY_MOVIES)
                  if (dir != null && !dir.exists()) dir.mkdirs()
                  val ts = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US)
                      .format(System.currentTimeMillis())
                  val file = File(dir, "REC_$ts.mp4")
                  val opts = FileOutputOptions.Builder(file).build()

                  activeRecording = capture.output
                      .prepareRecording(this, opts)
                      .withAudioEnabled()
                      .start(ContextCompat.getMainExecutor(this)) { ev ->
                          when (ev) {
                              is VideoRecordEvent.Start -> Log.d(TAG, "Started")
                              is VideoRecordEvent.Finalize -> {
                                  if (ev.hasError()) Log.e(TAG, "Err: ${ev.error}")
                                  else Log.d(TAG, "Saved: ${ev.outputResults.outputUri}")
                                  activeRecording = null
                              }
                          }
                      }
              }

              private fun stopRecordingAndService() {
                  try { activeRecording?.stop() } catch (_: Exception) {}
                  activeRecording = null
                  cameraProvider?.unbindAll(); cameraProvider = null
                  if (wakeLock.isHeld) wakeLock.release()
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  try { activeRecording?.stop() } catch (_: Exception) {}
                  cameraProvider?.unbindAll()
                  if (wakeLock.isHeld) wakeLock.release()
                  super.onDestroy()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val imp = when (prefs.getInt("importance", 0)) {
                          0 -> NotificationManager.IMPORTANCE_MIN
                          1 -> NotificationManager.IMPORTANCE_LOW
                          else -> NotificationManager.IMPORTANCE_DEFAULT
                      }
                      val ch = NotificationChannel(CHANNEL_ID, "Recording", imp).apply {
                          setShowBadge(false)
                          enableLights(false)
                          enableVibration(imp >= NotificationManager.IMPORTANCE_DEFAULT)
                          if (imp < NotificationManager.IMPORTANCE_DEFAULT) setSound(null, null)
                          lockscreenVisibility = Notification.VISIBILITY_SECRET
                      }
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(ch)
                  }
              }

              private fun iconRes(): Int = when (prefs.getInt("icon", 0)) {
                  0 -> R.drawable.ic_notification_logo
                  1 -> R.drawable.ic_notification_camera
                  2 -> R.drawable.ic_notification_video
                  else -> R.drawable.ic_notification_dot
              }

              private fun buildNotification(): Notification {
                  val title = prefs.getString("title", "Recording") ?: "Recording"
                  val text = prefs.getString("text", "Running") ?: "Running"
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setSmallIcon(iconRes())
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setSilent(true)
                      .setShowWhen(false)
                      .setOngoing(true)
                      .setCategory(NotificationCompat.CATEGORY_SERVICE)
                      .setVisibility(NotificationCompat.VISIBILITY_SECRET)
                      .build()
              }
          }
          EOF

